name: Elligo Health Research
description: 'Elligo Health Research is a healthcare-enabling clinical research organization
  (CRO) that embeds clinical trials directly into real-world healthcare settings. Through
  its proprietary IntElligo Research Stack and System of Accelerated Research (SOAR)
  model, Elligo connects sponsors and CROs to known, diverse patient populations across
  115+ hospitals and health systems, 200+ healthcare-based sites, and 100+ research-based
  sites. Services span site networks, patient access and recruitment, decentralized
  and hybrid trial solutions, site support and staffing, and concierge patient retention
  and travel logistics. Backed by Norwest Venture Partners, Elligo is tracked as a
  portfolio-lead in the API Evangelist network; it publishes no public API, developer
  portal, or OpenAPI at this time.'
